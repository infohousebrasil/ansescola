<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Matrícula - ANS Escola</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    
    .container { background: var(--card-bg); width: 100%; max-width: 800px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    h2 { color: var(--primary); margin-bottom: 8px; text-align: center; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #64748b; margin-bottom: 24px; font-size: 0.95rem; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
    .form-group.full-width { grid-column: 1 / -1; }
    
    label { font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: #334155; }
    input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
    
    button.btn-submit { background-color: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; transition: background 0.2s; }
    button.btn-submit:hover { background-color: var(--primary-hover); }

    .alert-success { display: none; background-color: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    .alert-success h3 { margin-bottom: 4px; font-size: 1.2rem; }
  </style>
</head>
<body>

<div class="container">
  <h2>Formulário de Matrícula</h2>
  <p class="subtitle">Preencha seus dados para concluir a matrícula na ANS Escola</p>

  <div id="mensagemSucesso" class="alert-success">
    <h3>Matrícula Enviada com Sucesso! 🎉</h3>
    <p>Seu código de matrícula é: <strong id="codigoMatriculaExibicao"></strong></p>
    <p>Em breve entraremos em contato com você.</p>
  </div>

  <form id="formMatricula">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" required placeholder="Digite seu nome completo">
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento *</label>
        <input type="date" id="dataNascimento" required>
      </div>

      <div class="form-group">
        <label for="cpf">CPF *</label>
        <input type="text" id="cpf" required placeholder="000.000.000-00">
      </div>

      <div class="form-group">
        <label for="rg">RG *</label>
        <input type="text" id="rg" required placeholder="Digite seu RG">
      </div>

      <div class="form-group">
        <label for="estadoCivil">Estado Civil</label>
        <select id="estadoCivil">
          <option value="Solteiro(a)">Solteiro(a)</option>
          <option value="Casado(a)">Casado(a)</option>
          <option value="Divorciado(a)">Divorciado(a)</option>
          <option value="Viuvo(a)">Viúvo(a)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone / WhatsApp *</label>
        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" required placeholder="seuemail@exemplo.com">
      </div>

      <div class="form-group">
        <label for="nomeMae">Nome da Mãe *</label>
        <input type="text" id="nomeMae" required>
      </div>

      <div class="form-group">
        <label for="nomePai">Nome do Pai</label>
        <input type="text" id="nomePai">
      </div>

      <div class="form-group full-width">
        <label for="endereco">Endereço (Rua, Número, Complemento) *</label>
        <input type="text" id="endereco" required placeholder="Rua / Avenida, nº, Apto">
      </div>

      <div class="form-group">
        <label for="bairro">Bairro *</label>
        <input type="text" id="bairro" required>
      </div>

      <div class="form-group">
        <label for="cidade">Cidade *</label>
        <input type="text" id="cidade" required>
      </div>

      <div class="form-group">
        <label for="estado">Estado (UF) *</label>
        <input type="text" id="estado" maxlength="2" required placeholder="EX: SP">
      </div>

      <div class="form-group">
        <label for="cep">CEP *</label>
        <input type="text" id="cep" required placeholder="00000-000">
      </div>
    </div>

    <button type="submit" class="btn-submit" id="btnSalvar">Finalizar Matrícula</button>
  </form>
</div>

<!-- SDKs do Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // === SUBSTUTA PELAS SUAS CHAVES DO FIREBASE ===
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJECT_ID.firebaseapp.com",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_PROJECT_ID.appspot.com",
    messagingSenderId: "SEU_MESSAGING_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("formMatricula");
  const btnSalvar = document.getElementById("btnSalvar");
  const mensagemSucesso = document.getElementById("mensagemSucesso");
  const codigoMatriculaExibicao = document.getElementById("codigoMatriculaExibicao");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btnSalvar.disabled = true;
    btnSalvar.innerText = "Enviando...";

    // Gerador de ID Único para novos alunos (ex: ANS-2026-8942)
    const idMatricula = "ANS-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000);

    const dadosAluno = {
      idMatricula: idMatricula,
      nome: document.getElementById("nome").value,
      dataNascimento: document.getElementById("dataNascimento").value,
      cpf: document.getElementById("cpf").value,
      rg: document.getElementById("rg").value,
      estadoCivil: document.getElementById("estadoCivil").value,
      telefone: document.getElementById("telefone").value,
      email: document.getElementById("email").value,
      nomeMae: document.getElementById("nomeMae").value,
      nomePai: document.getElementById("nomePai").value,
      endereco: document.getElementById("endereco").value,
      bairro: document.getElementById("bairro").value,
      cidade: document.getElementById("cidade").value,
      estado: document.getElementById("estado").value,
      cep: document.getElementById("cep").value,
      observacoesPagamento: "", // Inicialmente sem observações
      origem: "Formulário Web",
      criadoEm: serverTimestamp()
    };

    try {
      await setDoc(doc(db, "alunos", idMatricula), dadosAluno);
      
      // Exibe mensagem e ID
      codigoMatriculaExibicao.innerText = idMatricula;
      mensagemSucesso.style.display = "block";
      form.reset();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (error) {
      alert("Erro ao enviar matrícula: " + error.message);
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.innerText = "Finalizar Matrícula";
    }
  });
</script>

</body>
</html>
